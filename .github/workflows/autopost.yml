name: Instagram Auto Post

on:
  schedule:
    # Times are UTC. IST = UTC + 5:30. Runs every 10 min around each posting slot,
    # on odd minutes because GitHub often delays/drops runs scheduled at :00/:15/:30/:45.
    - cron: '7,17,27,37,47,57 4-6 * * 0,6'   # weekend morning   (10:00 IST slot)
    - cron: '7,17,27,37,47,57 7-9 * * 1-5'   # weekday afternoon (13:00 IST slot)
    - cron: '7,17,27,37,47,57 13-16 * * *'   # every evening     (19:00 / 19:30 IST slots)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = sirf token test | post-next-now = agli reel abhi post karo'
        type: choice
        options: [check, post-next-now]
        default: check

permissions:
  contents: write

concurrency:
  group: instagram-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: autopost
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q requests

      - name: Token check
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: python autopost/post.py check

      - name: Decide what to post
        id: decide
        if: github.event_name == 'schedule' || inputs.mode == 'post-next-now'
        run: |
          if [ "${{ inputs.mode }}" = "post-next-now" ]; then
            python autopost/post.py decide --force
          else
            python autopost/post.py decide
          fi

      - name: Post reel
        if: steps.decide.outputs.folder != ''
        run: |
          git sparse-checkout add "reels/${{ steps.decide.outputs.folder }}"
          python autopost/post.py post --folder "${{ steps.decide.outputs.folder }}" --slot "${{ steps.decide.outputs.slot }}"

      - name: Save posted log
        if: always() && steps.decide.outputs.folder != ''
        run: |
          git config user.name "insta-autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add autopost/posted.json
          git diff --cached --quiet || (git commit -m "Posted ${{ steps.decide.outputs.folder }}" && git pull --rebase && git push)
